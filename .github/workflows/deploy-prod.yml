name: Build master (deploy disabled)
# The Elastic Beanstalk environment this used to deploy to was terminated on 2026-10-29. The API is now
# served from the Raspberry Pi behind a Cloudflare tunnel (bible.codecrocs.dev), which is deployed by
# hand. The EB steps are left below, commented out, so the shape of the pipeline is still visible:
# restoring them means recreating the EB application and environment, and the secrets existing again.
on:
  push:
    branches:
    - master
jobs:
  build:
    runs-on: ubuntu-latest
    steps:

    - name: Checkout source code
      uses: actions/checkout@v4

    - name: Use the Go version from go.mod
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
        cache: true

    - name: Vet
      run: go vet ./...

    - name: Test
      run: go test ./... -count=1

    # Kept because this is the build the Pi actually runs: a push that does not cross-compile for
    # arm64 is a push that cannot be deployed, and that is worth knowing on every commit.
    - name: Cross-compile for the Pi
      run: GOOS=linux GOARCH=arm64 go build .

