name: CI
on:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:

    - name: Checkout source code
      uses: actions/checkout@v4

    # go.mod carries the toolchain version, so this cannot drift from it. The CLI's workflow reads it
    # the same way, which is what retired the reminder to keep GO_VERSION in step by hand.
    - name: Use the Go version from go.mod
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
        cache: true

    - name: Check formatting
      run: |
        unformatted="$(gofmt -l .)"
        if [ -n "$unformatted" ]; then
          echo "These files need gofmt:"
          echo "$unformatted"
          exit 1
        fi

    - name: Lint
      uses: golangci/golangci-lint-action@v9
      with:
        # Pinned to the version this code was checked against, so a new golangci-lint release
        # cannot turn the build red on its own.
        version: v2.14.0
        # Report every instance, not three of them: the default caps hide the rest behind
        # a red build, which turns one fix into a queue of them.
        args: --max-same-issues=0

    - name: Vet
      run: go vet ./...

    - name: Test
      run: go test ./... -count=1

    # This is a server: huma and chi serve each request on its own goroutine, so the detector has
    # something to check. Expensive enough to be its own step.
    - name: Test with the race detector
      run: go test -race ./... -count=1
