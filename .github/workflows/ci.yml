name: CI
on:
  pull_request:
env:
  GO_VERSION:  '1.25.x'  # set this to the go version to use
jobs:
  check:
    runs-on: ubuntu-latest
    steps:

    - name: Checkout source code
      uses: actions/checkout@v4

    - name: Use Go ${{ env.GO_VERSION }}
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Vet
      run: go vet ./...

    - name: Test
      run: go test ./... -count=1
